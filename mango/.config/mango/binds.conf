# ==============================================================================
# 🌸 RETRO SAKURA - MANGO WM KEYBINDINGS
# Format: Mango native conf (parsed by MangoWM & Quickshell KeybindSheet HUD)
# ==============================================================================

# ── Окна оболочки ──
bind=SUPER,space,spawn,quickshell ipc call modal toggle launcher # Лаунчер
bind=SUPER,d,spawn,quickshell ipc call modal toggle launcher # Лаунчер
bind=SUPER,v,spawn,quickshell ipc call modal toggle clipboard # Буфер обмена
bind=SUPER,slash,spawn,quickshell ipc call modal toggle cheatsheet # Шпаргалка
bind=SUPER,F1,spawn,quickshell ipc call modal toggle cheatsheet # Шпаргалка
bind=SUPER,w,spawn,quickshell ipc call modal toggle wallpapers # Обои
bind=SUPER,Tab,spawn,quickshell ipc call modal toggle overview # Обзор рабочих столов
bind=ALT,Tab,spawn,quickshell ipc call switcher next # Переключатель окон
bind=ALT+SHIFT,Tab,spawn,quickshell ipc call switcher prev # Переключатель окон (назад)
bind=SUPER,p,spawn,quickshell ipc call modal toggle power # Меню питания
bind=SUPER,period,spawn,quickshell ipc call modal toggle emoji # Эмодзи
bind=SUPER,i,spawn,quickshell ipc call modal toggle wininfo # Сведения об окне
bind=SUPER,comma,spawn,quickshell ipc call modal toggle settings # Настройки оболочки
bind=SUPER,b,spawn,quickshell ipc call modal toggle barconfig # Настройка панели
bind=SUPER,a,spawn,quickshell ipc call ai toggle # ИИ-помощник
bind=SUPER+SHIFT,p,spawn,quickshell ipc call privacy toggle # Приватный режим

# ── Приложения ──
bind=SUPER,Return,spawn,alacritty # Терминал
bind=SUPER,t,spawn,alacritty # Терминал
bind=SUPER,e,spawn,thunar # Файлы (Thunar)

# ── Окна и сеанс ──
bind=SUPER,q,spawn_shell,quickshell ipc call modal dismissOrKill || mmsg dispatch killclient # Закрыть окно
bind=SUPER,c,killclient # Закрыть окно
bind=SUPER,m,quit # Выйти из mango
bind=SUPER+SHIFT,q,quit # Выйти из mango
bind=SUPER,r,reload_config # Перезагрузить конфиг mango
bind=SUPER,l,spawn,lock # Заблокировать

# ── Управление окнами ──
bind=SUPER,backslash,togglefloating # Плавающее / плитка
bind=SUPER+SHIFT,f,togglefloating # Плавающее / плитка
bind=SUPER,f,togglefullscreen # Полный экран
bind=SUPER,n,switch_layout # Следующая раскладка окон
bind=SUPER,z,zoom # Сделать главным
bind=SUPER,minus,minimized # Свернуть в скретчпад
bind=SUPER,equal,restore_minimized # Вернуть из скретчпада

# ── Фокус и расположение ──
bind=SUPER,Left,focusdir,left # Фокус влево
bind=SUPER,Right,focusdir,right # Фокус вправо
bind=SUPER,Up,focusdir,up # Фокус вверх
bind=SUPER,Down,focusdir,down # Фокус вниз
bind=SUPER,h,focusdir,left # Фокус влево
bind=SUPER,k,focusdir,up # Фокус вверх
bind=SUPER,j,focusdir,down # Фокус вниз
bind=SUPER+SHIFT,Left,exchange_client,left # Поменять местами влево
bind=SUPER+SHIFT,Right,exchange_client,right # Поменять местами вправо
bind=SUPER+SHIFT,Up,exchange_client,up # Поменять местами вверх
bind=SUPER+SHIFT,Down,exchange_client,down # Поменять местами вниз
bind=SUPER+SHIFT,h,exchange_client,left # Поменять местами влево
bind=SUPER+SHIFT,l,exchange_client,right # Поменять местами вправо
bind=SUPER+SHIFT,k,exchange_client,up # Поменять местами вверх
bind=SUPER+SHIFT,j,exchange_client,down # Поменять местами вниз

# ── Рабочие столы ──
bind=SUPER,1,view,1,0 # Перейти на рабочий стол 1
bind=SUPER,2,view,2,0 # Перейти на рабочий стол 2
bind=SUPER,3,view,3,0 # Перейти на рабочий стол 3
bind=SUPER,4,view,4,0 # Перейти на рабочий стол 4
bind=SUPER,5,view,5,0 # Перейти на рабочий стол 5
bind=SUPER,6,view,6,0 # Перейти на рабочий стол 6
bind=SUPER,7,view,7,0 # Перейти на рабочий стол 7
bind=SUPER,8,view,8,0 # Перейти на рабочий стол 8
bind=SUPER,9,view,9,0 # Перейти на рабочий стол 9
bind=SUPER+SHIFT,1,tag,1,0 # Окно → рабочий стол 1
bind=SUPER+SHIFT,2,tag,2,0 # Окно → рабочий стол 2
bind=SUPER+SHIFT,3,tag,3,0 # Окно → рабочий стол 3
bind=SUPER+SHIFT,4,tag,4,0 # Окно → рабочий стол 4
bind=SUPER+SHIFT,5,tag,5,0 # Окно → рабочий стол 5
bind=SUPER+SHIFT,6,tag,6,0 # Окно → рабочий стол 6
bind=SUPER+SHIFT,7,tag,7,0 # Окно → рабочий стол 7
bind=SUPER+SHIFT,8,tag,8,0 # Окно → рабочий стол 8
bind=SUPER+SHIFT,9,tag,9,0 # Окно → рабочий стол 9

# ── Скриншоты ──
bind=NONE,Print,spawn,quickshell ipc call region menu # Скриншот (выделение)
bind=SUPER+SHIFT,s,spawn,quickshell ipc call region menu # Скриншот (выделение)
bind=SHIFT,Print,spawn,quickshell ipc call region edit # Скриншот + редактор
bind=CTRL,Print,spawn,quickshell ipc call region ocr # Распознать текст с экрана
bind=CTRL+SHIFT,Print,spawn,quickshell ipc call region record # Запись области / стоп
bind=SUPER+SHIFT,r,spawn,quickshell ipc call region recordSound # Запись со звуком / стоп

# ── Звук и мультимедиа ──
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ # Громкость +
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # Громкость −
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # Звук вкл/выкл
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # Микрофон вкл/выкл
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause # Пауза / играть
bind=NONE,XF86AudioNext,spawn,playerctl next # Следующий трек
bind=NONE,XF86AudioPrev,spawn,playerctl previous # Предыдущий трек
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+ # Яркость +
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%- # Яркость −

# ── Мышь и колесо ──
mousebind=SUPER,btn_left,moveresize,curmove # Двигать окно
mousebind=SUPER,btn_right,moveresize,curresize # Менять размер окна
axisbind=SUPER,up,viewtoleft_have_client # Предыдущий занятый рабочий стол
axisbind=SUPER,down,viewtoright_have_client # Следующий занятый рабочий стол
