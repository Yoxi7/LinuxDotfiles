# ==============================================================================
# 🌸 RETRO SAKURA / MINIMAL PIXEL - MANGO WM CONFIGURATION
# Format: TOML (Mangowm specification)
# Documentation: https://github.com/mangowm/mango / mango.wiki
# ==============================================================================

[global]

# --- Modular configuration sources ---
source = ["./binds.conf"]

# --- Appearance & Dimensions (Minimal Pixel Style) ---
border_px = 1
border_radius = 2
gap_inner_horizontal = 3
gap_inner_vertical = 3
gap_outer_horizontal = 6
gap_outer_vertical = 6

# --- Retro Sakura Color Palette (0xRRGGBBAA) ---
root_color = 0x060608ff         # Deep Dark Background (#060608)
border_color = 0x2e2538ff       # Inactive Dark Plum Border (#2e2538)
focus_color = 0xf3a6b8ff        # Active Sakura Pink Border (#f3a6b8)
urgent_color = 0xf3a6b8ff       # Urgent Window Border
split_color = 0xf3a6b8ff        # Dwindle Split Border

# --- Window Effects ---
animations = 1
blur = 1
shadows = 0

# --- Window Behavior ---
sloppy_focus = 1
warp_cursor = 0
focus_on_activate = 1
tag_num = 9

# --- Keyboard Settings ---
repeat_rate = 40
repeat_delay = 300
numlock_on = 0
xkb_rules_layout = "us,ru"
xkb_rules_options = "grp:caps_toggle"

# --- Pointer & Trackpad Settings ---
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 1
trackpad_disable_while_typing = 1
mouse_natural_scrolling = 0

# --- Autostart Daemons & Services ---
exec_once = [
    "quickshell",
    "awww-daemon",
    "/usr/lib/polkit-kde-authentication-agent-1",
    "wl-paste --type text --watch cliphist store",
    "wl-paste --type image --watch cliphist store",
    "gsettings set org.gnome.desktop.interface color-scheme prefer-dark",
    "gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark",
]

# --- Environment Variables ---
[env]
"PATH" = "~/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/bin"
"XDG_CURRENT_DESKTOP" = "mango"
"GTK_THEME" = "Adwaita:dark"

# ==============================================================================
# LAYER & WINDOW RULES
# ==============================================================================
[[rule.layer_rule]]
layer_name = "selection"
no_animation = 1
no_blur = 1

[[rule.layer_rule]]
layer_name = "qs-.*"
no_animation = 0

[[rule.window_rule]]
app_id = "pavucontrol"
is_floating = 1

[[rule.window_rule]]
app_id = "nm-connection-editor"
is_floating = 1
